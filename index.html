<!doctype html>
<html lang="en" class="loadscreen-active">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/loadingscrn/ldingBG.png" />
    <link rel="preload" as="image" href="/Icons/project-select/inactive-bg.png" />
    <link rel="preload" as="image" href="/Icons/project-select/active-crd-bg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waypoint Origin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      html.loadscreen-active {
        background: #fff;
      }
      html.loadscreen-active #root {
        visibility: hidden;
      }
    </style>
    <script>
      document.documentElement.classList.add('loadscreen-active')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
